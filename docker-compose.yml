services:
  s-accounting-service-fastapi:
    image: airplus/accounting-service:dev
    build: ../accounting-service
    container_name: c-accounting-service-fastapi
    ports:
      - "45680:8000"
    env_file:
      - .env
    volumes:
      - ../accounting-service:/app
    depends_on:
      s-mysql-service-fastapi:
        condition: service_healthy
    networks:
      - airplus-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  s-mysql-service-fastapi:
    image: mysql:8.0
    container_name: c-mysql-service-fastapi
    command: ["mysqld", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "45681:3306"
    volumes:
      - fastapi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airplus-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped

  s-phpmyadmin-service-fastapi:
    image: phpmyadmin:latest
    container_name: c-phpmyadmin-service-fastapi
    environment:
      PMA_HOST: s-mysql-service-fastapi
      PMA_PORT: "3306"
    ports:
      - "45682:80"
    depends_on:
      s-mysql-service-fastapi:
        condition: service_healthy
    networks:
      - airplus-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    restart: unless-stopped

  s-rabbitmq-service-fastapi:
    image: rabbitmq:4.1-management
    container_name: c-rabbitmq-service-fastapi
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-45683}:15672"
      - "${RABBITMQ_AMQP_PORT:-45684}:5672"
    volumes:
      - fastapi_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - airplus-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    restart: unless-stopped

  s-messaging-relay-fastapi:
    image: airplus/accounting-service:dev
    build: ../accounting-service
    container_name: c-messaging-relay-fastapi
    command: ["python", "-m", "app.workers", "relay"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../accounting-service:/app
    depends_on:
      s-mysql-service-fastapi:
        condition: service_healthy
      s-rabbitmq-service-fastapi:
        condition: service_healthy
    networks:
      - airplus-network
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  s-messaging-consumer-fastapi:
    image: airplus/accounting-service:dev
    build: ../accounting-service
    container_name: c-messaging-consumer-fastapi
    command: ["python", "-m", "app.workers", "consume", "ledger", "diagnostics"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../accounting-service:/app
    depends_on:
      s-mysql-service-fastapi:
        condition: service_healthy
      s-rabbitmq-service-fastapi:
        condition: service_healthy
    networks:
      - airplus-network
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

volumes:
  fastapi_mysql_data:
  fastapi_rabbitmq_data:

networks:
  airplus-network:
    external: true
